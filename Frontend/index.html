<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF9F6" />

    <title>Suman — Considered clothing</title>
    <meta
      name="description"
      content="Suman — premium everyday clothing for women and men. Considered materials, minimal silhouettes, made to last."
    />

    <!--
      Preconnect to the API origin so the first data request does not pay for
      DNS + TLS. Harmless when the dev proxy makes it same-origin.
    -->
    <link rel="preconnect" href="http://localhost:4000" crossorigin />

    <meta property="og:title" content="Suman — Considered clothing" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Premium everyday clothing, designed in Tashkent." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
